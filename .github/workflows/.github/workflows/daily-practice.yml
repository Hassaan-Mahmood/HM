
name: Daily Coding Practice

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-practice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create daily practice note
        run: |
          mkdir -p daily-notes
          DATE=$(date -u +%Y-%m-%d)
          FILE="daily-notes/$DATE.md"

          if [ ! -f "$FILE" ]; then
            echo "# Daily Coding Practice - $DATE" > "$FILE"
            echo "" >> "$FILE"
            echo "## Today's tasks" >> "$FILE"
            echo "- Solve one JavaScript problem." >> "$FILE"
            echo "- Review one TypeScript concept." >> "$FILE"
            echo "- Record what you learned." >> "$FILE"
          fi

      - name: Commit practice note
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-notes/
          if ! git diff --cached --quiet; then
            git commit -m "Add daily coding practice note"
            git push
          fi
